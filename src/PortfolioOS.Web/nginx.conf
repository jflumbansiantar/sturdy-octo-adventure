server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's default /etc/nginx/mime.types (included at the http level by the base
    # image's nginx.conf) already maps .wasm -> application/wasm and .json/.dll etc.
    # correctly — do NOT add a `types {}` block here, it replaces that whole table
    # instead of extending it.

    # Compression. The nginx base image ships with gzip commented out, so without
    # this block every asset goes over the wire raw: ~9.7 MB on first load instead
    # of ~3.7 MB.
    #
    # `dotnet publish` pre-builds a .gz next to every file under _framework/ (the
    # runtime, the assemblies, the ICU data). gzip_static serves those directly
    # rather than re-compressing multi-megabyte wasm on every request. Nothing
    # outside _framework/ ships a .gz, so plain `gzip` covers the rest on the fly —
    # the one that matters there is MudBlazor.min.css, 594 KB raw vs ~64 KB gzipped.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    # text/html is always compressed and cannot be listed here. Images and woff2 are
    # left out on purpose — they are already compressed formats.
    gzip_types
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Cache policy. Almost nothing here carries a fingerprint in its filename: of the
    # 54 files under _framework/, only the two dotnet.*.js loaders do. The 51 .wasm
    # assemblies, blazor.boot.json and the ICU data all keep a fixed name and change
    # contents on every deploy.
    #
    # For those, a long max-age is not merely stale, it breaks the app: the loader
    # fetches each assembly with the integrity hash listed in blazor.boot.json, so a
    # browser still holding a fresh-by-max-age copy of the previous deploy's
    # MudBlazor.wasm fails the integrity check and Blazor never starts.
    #
    # `no-cache` does not mean "do not store" — it means "store, but revalidate before
    # use". nginx answers unchanged files with a 304 off the ETag, so repeat visits
    # still transfer no bodies. Blazor also keeps validated assemblies in the browser's
    # Cache Storage, so most of these revalidations never happen at all.

    # Must precede the generic rule below: among regex locations nginx takes the first
    # match, not the best one. These two get a new filename on every build, so they are
    # the only assets here that can safely be cached forever.
    location ~ "^/_framework/dotnet\.(native|runtime)\.[0-9.]+\.[a-z0-9]{8,}\.js$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # `dat` covers the ICU payloads and `map` the source maps; without them those fall
    # through to the SPA fallback, where a missing file answers 200 + index.html
    # instead of 404.
    location ~* \.(?:css|js|wasm|dat|dll|json|map|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths resolve to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
