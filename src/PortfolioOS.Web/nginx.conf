server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's default /etc/nginx/mime.types (included at the http level by the base
    # image's nginx.conf) already maps .wasm -> application/wasm and .json/.dll etc.
    # correctly — do NOT add a `types {}` block here, it replaces that whole table
    # instead of extending it.

    # SPA fallback: unknown paths resolve to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|wasm|dll|json|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }
}
