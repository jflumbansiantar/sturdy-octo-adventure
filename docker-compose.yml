services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: portfolioos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Membuat database kedua (portfolioos_identity) saat volume pertama kali dibuat.
      - ./database/init-identity-db.sql:/docker-entrypoint-initdb.d/10-init-identity-db.sql:ro
      - ./database/init-admin-db.sql:/docker-entrypoint-initdb.d/20-init-admin-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolioos"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    build:
      context: .
      dockerfile: src/PortfolioOS.Identity/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdentityConnection: "Host=postgres;Port=5432;Database=portfolioos_identity;Username=postgres;Password=postgres"
      # Issuer harus memakai alamat yang dilihat browser, bukan nama service internal,
      # supaya redirect OIDC dan validasi token di API cocok.
      IdentityServer__IssuerUri: "http://localhost:5244"
      IdentityServer__PublicOrigin: "http://localhost:5244"
      IdentityServer__MetadataAddress: "http://localhost:8080/.well-known/openid-configuration"
      Clients__WebBaseUrl: "http://localhost:8081"
      Clients__ApiBaseUrl: "http://localhost:5243"
      Clients__AdminWebBaseUrl: "http://localhost:8082"
      Clients__EnableLegacyPasswordClient: "true"
      Clients__LegacyClientSecret: "legacy-secret-change-me"
      Clients__JobsClientSecret: "jobs-secret-change-me"
      Cookie__SameSite: "Lax"
    ports:
      - "5244:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/PortfolioOS.API/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=portfolioos;Username=postgres;Password=postgres"
      Jwt__Secret: "change-me-to-a-long-random-secret-key-min-32-chars"
      Jwt__Issuer: PortfolioOS
      Jwt__Audience: PortfolioOS
      Jwt__ExpiryHours: "24"
      Auth__Username: admin
      Auth__Password: password
      Auth__AllowLegacyTokens: "true"
      IdentityServer__Authority: "http://localhost:5244"
      IdentityServer__MetadataAddress: "http://identity:8080/.well-known/openid-configuration"
      IdentityServer__Audience: portfolioos-api
      IdentityServer__RequireHttpsMetadata: "false"
      Cors__AllowedOrigins__0: "http://localhost:8081"
    ports:
      - "5243:8080"

  admin:
    build:
      context: .
      dockerfile: src/PortfolioOS.Admin/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AdminConnection: "Host=postgres;Port=5432;Database=portfolioos_admin;Username=postgres;Password=postgres"
      IdentityServer__Authority: "http://localhost:5244"
      IdentityServer__MetadataAddress: "http://identity:8080/.well-known/openid-configuration"
      IdentityServer__Audience: portfolioos-api
      IdentityServer__RequireHttpsMetadata: "false"
      # Panggilan antar-container memakai nama service; token pemanggil diteruskan apa adanya.
      Downstream__IdentityBaseUrl: "http://identity:8080"
      Downstream__ApiBaseUrl: "http://api:8080"
      Cors__AllowedOrigins__0: "http://localhost:8082"
    ports:
      - "5245:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminweb:
    build:
      context: .
      dockerfile: src/PortfolioOS.AdminWeb/Dockerfile
    depends_on:
      - admin
    ports:
      - "8082:80"

  web:
    build:
      context: .
      dockerfile: src/PortfolioOS.Web/Dockerfile
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  pgdata:
