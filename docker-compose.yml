services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: portfolioos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init-identity-db.sql:/docker-entrypoint-initdb.d/10-init-identity-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolioos"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity:
    build:
      context: .
      dockerfile: src/PortfolioOS.Identity/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdentityConnection: "Host=postgres;Port=5432;Database=portfolioos_identity;Username=postgres;Password=postgres"
      IdentityServer__IssuerUri: "https://pwm.srv1898824.hstgr.cloud"
      IdentityServer__PublicOrigin: "https://pwm.srv1898824.hstgr.cloud/"
      IdentityServer__MetadataAddress: "https://pwm.srv1898824.hstgr.cloud/.well-known/openid-configuration"
      Clients__WebBaseUrl: "https://pwm.srv1898824.hstgr.cloud/"
      Clients__ApiBaseUrl: "/api"
      Clients__EnableLegacyPasswordClient: "true"
      Clients__LegacyClientSecret: "legacy-secret-change-me"
      Clients__JobsClientSecret: "jobs-secret-change-me"
      Cookie__SameSite: "Lax"
      Email__SmtpHost: "mailpit"
      Email__SmtpPort: "1025"
      Email__FromAddress: "no-reply@portfolioos.local"
      IssuerUri: "https://pwm.srv1898824.hstgr.cloud"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.pwm-identity.rule=Host(`pwm.srv1898824.hstgr.cloud`) && (PathPrefix(`/.well-known`) || PathPrefix(`/connect`) || PathPrefix(`/account`))
      - traefik.http.routers.pwm-identity.entrypoints=websecure
      - traefik.http.routers.pwm-identity.tls.certresolver=letsencrypt
      - traefik.http.services.pwm-identity.loadbalancer.server.port=8080
    ports:
      - "5244:8080"

  api:
    build:
      context: .
      dockerfile: src/PortfolioOS.API/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=portfolioos;Username=postgres;Password=postgres"
      Jwt__Secret: "PQDAXACiAgtieBRm5V0ztUeeEcobi6K9Z0e5CU84TYU="
      Jwt__Issuer: PortfolioOS
      Jwt__Audience: PortfolioOS
      Jwt__ExpiryHours: "24"
      Auth__Username: admin
      Auth__Password: password
      Auth__AllowLegacyTokens: "true"
      IdentityServer__Authority: "https://pwm.srv1898824.hstgr.cloud/"
      IdentityServer__MetadataAddress: "http://identity:8080/.well-known/openid-configuration"
      IdentityServer__Audience: portfolioos-api
      IdentityServer__RequireHttpsMetadata: "false"
      Cors__AllowedOrigins__0: "https://pwm.srv1898824.hstgr.cloud/"
    ports:
      - "5243:8080"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.pwm-api.rule=Host(`pwm.srv1898824.hstgr.cloud`) && PathPrefix(`/api`)
      - traefik.http.routers.pwm-api.entrypoints=websecure
      - traefik.http.routers.pwm-api.tls.certresolver=letsencrypt
      - traefik.http.services.pwm-api.loadbalancer.server.port=8080

  web:
    build:
      context: .
      dockerfile: src/PortfolioOS.Web/Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - "8081:80"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.pwm.rule=Host(`pwm.srv1898824.hstgr.cloud`)
      - traefik.http.routers.pwm.entrypoints=websecure
      - traefik.http.routers.pwm.tls.certresolver=letsencrypt
      - traefik.http.services.pwm.loadbalancer.server.port=80

volumes:
  pgdata:
